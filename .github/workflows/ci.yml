name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go mod tidy
      - run: ./scripts/fetch-assets.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-lock
          path: go.sum
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-nomad@v1.0.0
        with:
          version: '2.1.1'
      - uses: hashicorp/setup-nomad-pack@0.10.0
        with:
          version: '0.4.2'
      - run: python3 scripts/check-pack.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make integration
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm test
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go, pack, integration, release-config]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
