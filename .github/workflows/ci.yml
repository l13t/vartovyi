name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go mod tidy
      - run: ./scripts/fetch-assets.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-lock
          path: go.sum
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install verified Nomad CLIs
        env:
          NOMAD_VERSION: '2.1.1'
          NOMAD_PACK_VERSION: '0.4.2'
        run: |
          tool_dir="$RUNNER_TEMP/vartovyi-tools"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          for product in nomad nomad-pack; do
            case "$product" in
              nomad) version="$NOMAD_VERSION" ;;
              nomad-pack) version="$NOMAD_PACK_VERSION" ;;
            esac
            archive="${product}_${version}_linux_amd64.zip"
            checksums="${product}_${version}_SHA256SUMS"
            base="https://releases.hashicorp.com/$product/$version"
            curl --fail --silent --show-error --location --retry 3 --max-time 60 "$base/$archive" -o "$archive"
            curl --fail --silent --show-error --location --retry 3 --max-time 60 "$base/$checksums" -o "$checksums"
            awk -v archive="$archive" '$2 == archive { print }' "$checksums" | sha256sum --check --status
            unzip -p "$archive" "$product" > "$product"
            chmod +x "$product"
          done
          echo "$tool_dir" >> "$GITHUB_PATH"
      - run: python3 scripts/check-pack.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make integration
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go, pack, integration, release-config]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
