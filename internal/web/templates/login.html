{{define "login"}}{{template "head" .}}<section class="login"><p class="eyebrow">{{tr $.Language "ВІДЕО ПІД КОНТРОЛЕМ"}}</p><h1>{{tr $.Language "Вітаємо у Вартовому"}}</h1><p class="muted">{{tr $.Language "Увійди, щоб переглянути камери й архів."}}</p><form action="/login" method="post"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>{{tr $.Language "Користувач"}}<input name="username" required autocomplete="username"></label><label>{{tr $.Language "Пароль"}}<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">{{tr $.Language "Увійти"}}</button></form>{{if .OIDC}}<a class="button" href="/auth/oidc">{{tr $.Language "Увійти через OIDC"}}</a>{{end}}</section>{{template "foot" .}}{{end}}
